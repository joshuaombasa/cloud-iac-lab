AWSTemplateFormatVersion: '2010-09-09'
Description: A simple CloudFormation template to create an Amazon EKS Cluster and Node Group.

Resources:
  # Create the VPC
  MyVPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MyEKS-VPC

  # Create an Internet Gateway
  MyInternetGateway:
    Type: 'AWS::EC2::InternetGateway'

  # Attach the Internet Gateway to the VPC
  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref MyInternetGateway

  # Create a Public Subnet
  MyPublicSubnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '10.0.1.0/24'
      AvailabilityZone: 'us-east-1a'
      MapPublicIpOnLaunch: true

  # Create an EKS Cluster
  MyEKSCluster:
    Type: 'AWS::EKS::Cluster'
    Properties:
      Name: MyEKSCluster
      Version: '1.27'
      RoleArn: 'arn:aws:iam::YOUR_ACCOUNT_ID:role/AmazonEKSClusterRole' # Update with your IAM role
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref MyPublicSubnet

  # Create an EKS Node Group
  MyNodeGroup:
    Type: 'AWS::EKS::Nodegroup'
    Properties:
      ClusterName: !Ref MyEKSCluster
      NodeRole: 'arn:aws:iam::YOUR_ACCOUNT_ID:role/AmazonEKSNodeRole' # Update with your IAM role
      Subnets:
        - !Ref MyPublicSubnet
      ScalingConfig:
        MinSize: 1
        MaxSize: 3
        DesiredSize: 2
      InstanceTypes:
        - 't3.medium'

Outputs:
  ClusterName:
    Description: The name of the EKS cluster
    Value: !Ref MyEKSCluster
